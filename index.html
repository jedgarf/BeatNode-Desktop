<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beatnode.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeatNode</title>
    <script>
      // same lookup as theme.ts, early so the splash matches
      try {
        const mode = JSON.parse(localStorage.getItem('beatnode-theme') || '{}').state?.mode || 'system'
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <style>
      #splash {
        --s-bg: #0a0a0f;
        --s-fg: #ffffff;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(600px 400px at 50% 42%, rgba(139, 92, 246, 0.22), transparent 70%), var(--s-bg);
        color: var(--s-fg);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      [data-theme='light'] #splash {
        --s-bg: #f4f4f9;
        --s-fg: #14141c;
        background: radial-gradient(600px 400px at 50% 42%, rgba(124, 58, 237, 0.16), transparent 70%), var(--s-bg);
      }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .tile {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: linear-gradient(135deg, #a78bfa, #7c3aed 45%, #c026d3);
        box-shadow: 0 20px 50px -12px rgba(124, 58, 237, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding-left: 6px;
        animation: s-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #splash .bar {
        width: 8px;
        border-radius: 4px;
        background: #fff;
        animation: s-beat 0.8s ease-in-out infinite alternate;
      }
      #splash .bar:nth-child(1) { height: 52px; }
      #splash .bar:nth-child(2) { height: 40px; animation-delay: -0.3s; }
      #splash .bar:nth-child(3) { height: 28px; animation-delay: -0.55s; }
      #splash .bar:nth-child(4) { height: 16px; animation-delay: -0.15s; }
      #splash .dot {
        width: 10px;
        height: 10px;
        margin-left: 3px;
        border-radius: 50%;
        background: #fff;
        animation: s-pulse 0.8s ease-in-out infinite alternate;
      }
      #splash .name {
        font-size: 26px;
        letter-spacing: -0.02em;
        animation: s-rise 0.7s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash .name b { font-weight: 700; }
      #splash .name span { font-weight: 300; opacity: 0.7; }
      #splash .progress {
        width: 120px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: color-mix(in srgb, var(--s-fg) 10%, transparent);
        animation: s-rise 0.7s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash .progress::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #a78bfa, #c026d3);
        animation: s-slide 1.1s ease-in-out infinite;
      }
      @keyframes s-pop { from { opacity: 0; transform: scale(0.6) rotate(-8deg); } }
      @keyframes s-rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes s-beat { from { transform: scaleY(0.45); } }
      @keyframes s-pulse { from { transform: scale(0.6); opacity: 0.6; } }
      @keyframes s-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="tile"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="dot"></i></div>
      <div class="name"><b>Beat</b><span>Node</span></div>
      <div class="progress"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
